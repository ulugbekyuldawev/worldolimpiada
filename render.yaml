# Render Blueprint: Dashboard → New → Blueprint → shu repozitoriyani tanlang.
services:
  - type: web            # bepul tarifda faqat Web Service bor; bot port ochadi (health server)
    name: olimpiada-bot
    runtime: python
    plan: free
    numInstances: 1      # bot polling rejimida: faqat 1 ta nusxa bo'lishi kerak
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED   # loglar darhol ko'rinsin
        value: "1"
      - key: BOT_TOKEN
        sync: false      # Render so'raydi, qo'lda kiritasiz
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DATABASE_URL
        fromDatabase:
          name: olimpiada-db
          property: connectionString

databases:
  - name: olimpiada-db
    plan: free
    databaseName: olimpiada
    user: olimpiada
